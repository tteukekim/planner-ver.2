<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 플래너</title>

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플래너">

<style>
:root{--bg:#fff6d6;--card:#fffdf4;--tx:#4a2f27;--mut:#9a7f72;--ac:#f5a623;--ac2:#f7b9c8;--bd:#f1dfa6;--ok:#6fae5b;--bad:#e0566a;--side:#fbd45c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2320;--card:#352c28;--tx:#fbeed2;--mut:#bfa99b;--ac:#f5b73d;--ac2:#d98ba0;--bd:#4b3f38;--side:#4a3a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2320;--card:#352c28;--tx:#fbeed2;--mut:#bfa99b;--ac:#f5b73d;--ac2:#d98ba0;--bd:#4b3f38;--side:#4a3a22;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;min-height:100vh}
aside{width:200px;background:var(--side);padding:18px 12px;position:sticky;top:0;height:100vh;flex:none;border-right:4px dotted var(--card)}
aside h2{margin:0 0 16px;font-size:18px}
aside button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--tx);padding:11px 12px;border-radius:14px;font:inherit;cursor:pointer;margin-bottom:4px}
aside button.on{background:var(--card);font-weight:700;box-shadow:0 2px 0 var(--ac2)}
main{flex:1;min-width:0;padding:16px 16px 40px;max-width:900px}
h1{font-size:20px;margin:0 0 12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sp{flex:1}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:8px 10px}
textarea{width:100%;min-height:80px}input[type=text],input[type=number]{width:100%}
button{cursor:pointer}.pri{background:var(--ac);border-color:var(--ac);color:#4a2f27;font-weight:700}
.pink{background:var(--ac2);border-color:var(--ac2);color:#4a2f27}
.ghost{background:none;border:none;color:var(--mut);padding:4px 8px}
.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal>b{font-size:12px;color:var(--mut);font-weight:600;text-align:center}
.cell{min-height:74px;padding:3px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);text-align:left;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;width:100%}
.cell.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.cell.today .dn{background:var(--ac2);border-radius:99px;padding:0 6px}
.cell.off{opacity:.35}
.dn{font-size:12px;font-weight:700;align-self:flex-start}
.chip{display:block;font-size:10.5px;line-height:1.3;padding:1px 4px;margin-top:2px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a2f27}
.item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;margin-bottom:6px;color:#4a2f27}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}.item.done span.t{text-decoration:line-through;opacity:.6}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw i{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:block}.sw i.on{border-color:var(--tx)}
.big{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--ac);border-radius:6px 6px 0 0;margin-bottom:3px}
.tag{font-size:10px;padding:0 6px;border-radius:99px;background:rgba(255,255,255,.65)}
.hid{display:none}
@media (max-width:720px){
 body{display:block;padding-bottom:70px}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-right:none;border-top:4px dotted var(--card)}
 aside h2{display:none}aside button{text-align:center;margin:0 2px;padding:10px 4px;font-size:13px}
 .cell{min-height:58px}.chip{font-size:9.5px}
}

aside{display:flex;flex-direction:column}
.face{flex:1;min-height:110px;margin:8px 0;background-repeat:no-repeat;background-position:center bottom;background-size:contain;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.acct{font-size:11px;background:rgba(255,253,244,.78);color:#4a2f27;border-radius:12px;padding:6px 8px}
.acct .ar{display:flex;align-items:center;gap:4px}.acct .ar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct button{display:inline-block;width:auto;margin:0;padding:1px 7px;font-size:10px;text-align:center;background:#fff;border:1px solid var(--bd);border-radius:99px}
.acct .lk{margin-top:4px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}.dot.g{background:var(--ok)}.dot.o{background:#f5a623}
.macct{display:none}
.catchip{border:2px solid transparent;border-radius:99px;padding:5px 12px;color:#4a2f27;font-weight:600}.catchip.on{border-color:var(--tx)}
.mhead{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}.rf{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:18px}.mt{font-size:24px;font-weight:800;min-width:150px;text-align:center}
.wkrow{position:relative;height:38px;margin-bottom:4px;border-radius:12px;background:rgba(251,212,92,.22)}
.wkrow .wk{position:relative;z-index:1;height:100%;align-items:center}
.wk b{font-size:13px;color:var(--tx);font-weight:700}.wk b.su{color:#d9566e}.wk b.sa{color:#4a86c9}
.d{position:absolute;z-index:0;background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none;opacity:.95}
.d1{width:46px;height:30px;left:calc(14.3% - 23px);top:4px}.d2{width:24px;height:24px;left:calc(42.9% - 12px);top:7px}.d3{width:46px;height:30px;left:calc(71.5% - 23px);top:4px}.d4{width:30px;height:30px;left:calc(85.8% - 15px);top:4px}
.ban{height:190px;margin-top:12px;border-radius:14px;background-color:#FFF3C1;background-repeat:no-repeat;background-position:center;background-size:contain}
@media (max-width:720px){aside{flex-direction:row}aside button{flex:1}.face,.acct{display:none}.macct{display:block;margin:-6px 0 10px}.macct .acct{display:block;background:var(--card);color:var(--tx)}.mt{font-size:20px;min-width:120px}.ban{height:150px}.d1,.d3{width:30px;height:22px;top:8px;left:auto}.d1{left:calc(14.3% - 15px)}.d3{left:calc(71.5% - 15px)}.d2{width:18px;height:18px;left:calc(42.9% - 9px)}.d4{width:22px;height:22px;left:calc(85.8% - 11px);top:8px}}
</style>

<body>
<aside id="side"></aside>
<main><h1 id="ttl"></h1><div id="macct" class="macct"></div><div id="app"></div></main>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const TODAY=fmt(new Date()),DAYS=['일','월','화','수','목','금','토'],SRV='Google Calendar';
const COLORS=['#FBD45C','#F7B9C8','#FFFBD0','#D5E6A8','#BFDDF5','#D9CCF2','#C6EBD9','#FFD6B8'];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
let S={tasks:[],logs:[],sess:[],hl:{},timer:null,off:{},wr:'',push:false,todos:[],ex:[],cat:{},pay:{},logDel:[],drive:null};
try{const r=localStorage.getItem('planner-v2')||localStorage.getItem('planner-v1');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('planner-v2',JSON.stringify(S))}catch(e){}}
let tab='cal',sel=TODAY,cm=TODAY.slice(0,7),mcp=null,cals=[],gev=[],gstat={s:'load',m:''},pick=COLORS[0],tick=null;
let F={t:'',d1:'',d2:'',t1:'',t2:'',dest:'app',cat:'기타',pt:'시급',amt:'',lg:{sj:'',nn:'',mn:''},todo:'',todoDest:'',todoDue:'',q:'',ex:{date:'',name:'',min:'',detail:'',note:'',push:false}};
const gdate=e=>(e.start.dateTime||e.start.date||'').slice(0,10);
const gtime=e=>e.start.dateTime?e.start.dateTime.slice(11,16):'종일';
const hlOf=id=>S.hl[id]||'#E8E2CF';

/* ---------- Google Calendar (직접 연동) ---------- */
const CLIENT_ID='1040361663037-5rh878kkqg25d5ogjclg6tgv8ee8qmpk.apps.googleusercontent.com'; // 예: 1234-abcd.apps.googleusercontent.com
const SCOPE='https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/drive.file';
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
S.accts=S.accts||[];let tok={},tc=null,gtasks=[],tstat={};
try{const r=JSON.parse(localStorage.getItem('planner-tok')||'{}');Object.keys(r).forEach(k=>{if(r[k].exp>Date.now())tok[k]=r[k]})}catch(e){}
function saveTok(){try{localStorage.setItem('planner-tok',JSON.stringify(tok))}catch(e){}}
const isW=c=>c.role==='owner'||c.role==='writer';
function errMsg(e){
  if(e&&e.code==='expired')return'로그인이 만료됐어요. 해당 계정의 “다시 연결”을 눌러 주세요.';
  return'구글 캘린더 오류: '+(e&&(e.message||e.error)||'알 수 없음');
}
function initG(){
  if(CLIENT_ID.startsWith('여기에')){gstat={s:'none',m:'index.html 위쪽의 CLIENT_ID에 클라이언트 ID를 붙여넣어 주세요.'};render();return}
  const t=setInterval(()=>{if(window.google&&google.accounts){clearInterval(t);
    tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:onTok});gstat={s:'idle',m:''};render();if(S.accts.some(a=>tok[a]&&tok[a].exp>Date.now()))syncG()}},200);
}
function connect(email){if(tc)tc.requestAccessToken(email?{login_hint:email,prompt:''}:{prompt:'select_account'})}
async function onTok(r){
  if(r.error){gstat={s:'err',m:'로그인 실패: '+r.error};render();return}
  try{
    const res=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?maxResults=100',{headers:{Authorization:'Bearer '+r.access_token}});
    const l=await res.json();const p=(l.items||[]).find(c=>c.primary);
    if(!p)throw{message:'계정 정보를 읽지 못했어요'};
    tok[p.id]={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};saveTok();
    if(!S.accts.includes(p.id)){S.accts.push(p.id);save()}
    syncG();
  }catch(e){gstat={s:'err',m:errMsg(e)};render()}
}
function rmAcct(a){S.accts=S.accts.filter(x=>x!==a);delete tok[a];saveTok();save();syncG()}
async function api(acct,path,opt={}){
  const k=tok[acct];if(!k||k.exp<Date.now())throw{code:'expired',acct};
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+k.t,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){delete tok[acct];saveTok();throw{code:'expired',acct}}
  if(!r.ok)throw{message:(await r.text()).slice(0,160)};
  return r.status===204?null:r.json();
}
async function syncG(){
  if(!tc)return;
  gstat={s:'load',m:''};render();
  const[y,m]=cm.split('-').map(Number);
  const a=new Date(y,m-1,1).toISOString(),b=new Date(y,m,1).toISOString();
  const nc=[],ne=[];let bad=null;
  for(const ac of S.accts){
    try{
      const l=await api(ac,'/users/me/calendarList?maxResults=100');
      for(const c of l.items){
        if(nc.some(x=>x.id===c.id))continue;
        const cc={id:c.id,summary:c.summaryOverride||c.summary,acct:ac,k:ac+'|'+c.id,role:c.accessRole};nc.push(cc);
        if(S.off[cc.k])continue;
        const p=await api(ac,'/calendars/'+encodeURIComponent(c.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin='+encodeURIComponent(a)+'&timeMax='+encodeURIComponent(b));
        (p.items||[]).forEach(e=>ne.push({...e,_cal:c.id,_acct:ac,_calName:cc.summary}));
      }
    }catch(e){if(!e||e.code!=='expired')bad=e}
  }
  cals=nc;gev=ne;gev.forEach((e,i)=>e._i=i);
  gstat=bad?{s:'err',m:errMsg(bad)}:{s:'ok',m:'',t:new Date()};
  render();syncT();if(S.drive)driveSync();
}
function addMin(t,m){const[h,mi]=t.split(':').map(Number);const x=h*60+mi+m;return pad(Math.floor(x/60)%24)+':'+pad(x%60)}
async function insEv(k,title,date,st,en,endDate){
  const c=cals.find(x=>x.k===k);if(!c)throw{message:'쓸 수 있는 캘린더가 없어요'};
  const body={summary:title};
  if(!st){body.start={date};body.end={date:add(endDate||date,1)}}
  else{body.start={dateTime:date+'T'+st+':00',timeZone:TZ};body.end={dateTime:(endDate||date)+'T'+(en||addMin(st,60))+':00',timeZone:TZ}}
  return api(c.acct,'/calendars/'+encodeURIComponent(c.id)+'/events',{method:'POST',body});
}
async function gCreate(){
  const title=F.t.trim();if(!title)return;
  const d1=F.d1||sel,d2=(F.d2&&F.d2>d1)?F.d2:d1,st=F.t1,en=F.t2;
  const meta=id=>{S.cat[id]=F.cat;if(F.cat==='알바'&&+F.amt)S.pay[id]={type:F.pt,amt:+F.amt};save()};
  const reset=()=>{F.t='';F.d1='';F.d2='';F.t1='';F.t2='';F.amt='';sel=d1;cm=d1.slice(0,7)};
  if(F.dest==='app'){const id=uid();S.tasks.push({id,date:d1,end:d2,text:title,done:false,color:pick,time:st,t2:en});meta(id);reset();save();render();return}
  try{const p=await insEv(cals[+F.dest].k,title,d1,st,en,d2);if(p&&p.id){S.hl[p.id]=pick;meta(p.id)}reset();await syncG()}
  catch(e){gstat={s:'err',m:errMsg(e)};render()}
}
async function gDel(i){
  const e=gev[i];if(!e||!confirm('구글 캘린더에서도 삭제돼요. 삭제할까요?'))return;
  try{await api(e._acct,'/calendars/'+encodeURIComponent(e._cal)+'/events/'+e.id,{method:'DELETE'});delete S.hl[e.id];delete S.cat[e.id];delete S.pay[e.id];save();await syncG()}
  catch(x){gstat={s:'err',m:errMsg(x)};render()}
}
async function gRename(i){
  const e=gev[i];const v=prompt('새 제목',e.summary||'');if(!v||v===e.summary)return;
  try{await api(e._acct,'/calendars/'+encodeURIComponent(e._cal)+'/events/'+e.id,{method:'PATCH',body:{summary:v}});await syncG()}
  catch(x){gstat={s:'err',m:errMsg(x)};render()}
}
function setHl(id,c){S.hl[id]=c;save();render()}

/* ---------- local tasks, logs ---------- */
function toggle(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function delT(id){S.tasks=S.tasks.filter(x=>x.id!==id);delete S.cat[id];delete S.pay[id];save();render()}
function setTC(id,c){S.tasks.find(x=>x.id===id).color=c;save();render()}
const sessMin=d=>Math.round(S.sess.filter(s=>s.date===d).reduce((a,s)=>a+s.sec,0)/60)+Math.round(S.logs.filter(l=>l.date===d).reduce((a,l)=>a+(+l.min||0),0));
function addLog(){const g=F.lg,subject=g.sj.trim(),note=g.nn.trim(),min=+g.mn||0;if(!subject&&!note)return;S.logs.push({id:uid(),date:sel,subject:subject||'기타',min,note});F.lg={sj:'',nn:'',mn:''};save();render();if(S.drive)driveSync(true)}
function delLog(id){S.logs=S.logs.filter(x=>x.id!==id);S.logDel=[...(S.logDel||[]),id];save();render();if(S.drive)driveSync(true)}

/* ---------- timer ---------- */
const elapsed=()=>S.timer?Math.floor((Date.now()-S.timer.start)/1000):0;
const hms=s=>pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);
function tStart(){
  const sub=($('#ts')&&$('#ts').value.trim())||'공부';
  S.timer={start:Date.now(),subject:sub};save();render();
}
async function tStop(){
  const t=S.timer;if(!t)return;
  const sec=elapsed(),end=new Date(),st=new Date(t.start);
  S.timer=null;
  if(sec>=10)S.sess.push({id:uid(),date:fmt(st),subject:t.subject,sec,start:pad(st.getHours())+':'+pad(st.getMinutes())});
  save();render();
  const wk=S.wr||(cals.find(isW)||{}).k;
  if(S.push&&sec>=60&&wk){
    try{
      await insEv(wk,'📚 '+t.subject+' ('+Math.round(sec/60)+'분)',fmt(st),pad(st.getHours())+':'+pad(st.getMinutes()),pad(end.getHours())+':'+pad(end.getMinutes()),fmt(end));
      syncG();
    }catch(e){gstat={s:'err',m:errMsg(e)};render()}
  }
}

const CATS=['알바','가족행사','약속','기타'],CATC={'알바':'#BFDDF5','가족행사':'#F7B9C8','약속':'#D5E6A8','기타':'#FFFBD0'};
const evInfo=e=>{const sd=gdate(e),ed=e.end?(e.end.date?add(e.end.date,-1):e.end.dateTime.slice(0,10)):sd;return{sd,ed:ed<sd?sd:ed,st:e.start.dateTime?e.start.dateTime.slice(11,16):'',en:e.end&&e.end.dateTime?e.end.dateTime.slice(11,16):''}};
const evOn=(e,k)=>{const i=evInfo(e);return i.sd<=k&&k<=i.ed};
const taskOn=(t,k)=>t.date<=k&&k<=(t.end||t.date);
const mm=t=>+t.slice(0,2)*60+ +t.slice(3,5);
function earn(cat,pay,sd,ed,st,en){
  if(cat!=='알바'||!pay||!pay.amt)return null;
  const days=Math.round((parse(ed)-parse(sd))/864e5)+1;
  if(pay.type==='일급')return{total:pay.amt*days,note:''};
  if(!st||!en)return{total:0,note:'시간 입력 필요'};
  let m=mm(en)-mm(st),dd=days;if(m<=0){m+=1440;if(days===2)dd=1}
  return{total:Math.round(pay.amt*m/60*dd),note:''};
}

/* todo + Google Tasks */
async function tapi(acct,path,opt={}){
  const k=tok[acct];if(!k||k.exp<Date.now())throw{code:'expired',acct};
  const r=await fetch('https://tasks.googleapis.com/tasks/v1'+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+k.t,'Content-Type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){delete tok[acct];saveTok();throw{code:'expired',acct}}
  if(r.status===403)throw{code:'scope'};
  if(!r.ok)throw{message:(await r.text()).slice(0,160)};
  return r.status===204?null:r.json();
}
const errT=e=>e.code==='expired'?'로그인이 만료됐어요. 사이드바에서 “다시 연결”을 눌러 주세요.':e.code==='scope'?'Google Tasks 권한이 없어요. 콘솔에서 Tasks API를 켠 뒤 “권한 받기”를 눌러 주세요.':(e.message||'오류');
async function syncT(){
  if(!tc)return;
  const out=[],st={};
  for(const ac of S.accts){
    if(!tok[ac]||tok[ac].exp<Date.now())continue;
    try{const p=await tapi(ac,'/lists/@default/tasks?showCompleted=true&showHidden=false&maxResults=100');(p.items||[]).forEach(t=>out.push({...t,_acct:ac}))}
    catch(e){st[ac]=errT(e)}
  }
  const op=out.filter(t=>t.status!=='completed'),cp=out.filter(t=>t.status==='completed').sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,15);
  gtasks=[...op,...cp];tstat=st;render();
}
const todoDest=()=>(F.todoDest&&S.accts.includes(F.todoDest))?F.todoDest:(S.accts[0]||'');
async function addTodo(){
  const t=F.todo.trim(),dest=todoDest(),due=F.todoDue;if(!t||!dest)return;
  try{
    const body={title:t};if(due)body.due=due+'T00:00:00.000Z';
    const r=await tapi(dest,'/lists/@default/tasks',{method:'POST',body});
    gtasks.unshift({...r,_acct:dest});F.todo='';F.todoDue='';delete tstat[dest];render();const i=$('#todoin');if(i)i.focus();
  }catch(e){tstat[dest]=errT(e);render()}
}
async function moveTodos(){
  const dest=todoDest();if(!dest)return;
  for(const t of [...S.todos]){
    try{
      const body={title:t.text,status:t.done?'completed':'needsAction'};if(t.due)body.due=t.due+'T00:00:00.000Z';
      const r=await tapi(dest,'/lists/@default/tasks',{method:'POST',body});
      gtasks.unshift({...r,_acct:dest});S.todos=S.todos.filter(x=>x.id!==t.id);save();
    }catch(e){tstat[dest]=errT(e);break}
  }
  render();
}
function togTodo(id){const t=S.todos.find(x=>x.id===id);t.done=!t.done;save();render()}
function delTodo(id){S.todos=S.todos.filter(x=>x.id!==id);save();render()}
async function togGT(i){
  const t=gtasks[i];if(!t)return;const done=t.status!=='completed';
  try{const r=await tapi(t._acct,'/lists/@default/tasks/'+t.id,{method:'PATCH',body:done?{status:'completed'}:{status:'needsAction',completed:null}});Object.assign(t,r);render()}
  catch(e){tstat[t._acct]=errT(e);render()}
}
async function delGT(i){
  const t=gtasks[i];if(!t)return;
  try{await tapi(t._acct,'/lists/@default/tasks/'+t.id,{method:'DELETE'});gtasks.splice(i,1);render()}
  catch(e){tstat[t._acct]=errT(e);render()}
}
async function clrTodo(){
  S.todos=S.todos.filter(x=>!x.done);save();
  const accs=[...new Set(gtasks.filter(t=>t.status==='completed').map(t=>t._acct))];
  for(const a of accs){try{await tapi(a,'/lists/@default/clear',{method:'POST'})}catch(e){tstat[a]=errT(e)}}
  gtasks=gtasks.filter(t=>t.status!=='completed');render();
}

function monthSum(){

  S.tasks.forEach(t=>{if(S.cat[t.id]==='알바'&&t.date.slice(0,7)===cm){cnt++;const r=earn('알바',S.pay[t.id],t.date,t.end||t.date,t.time,t.t2);if(r)inc+=r.total}});
  const exd=new Set(S.ex.filter(x=>x.date.slice(0,7)===cm).map(x=>x.date)).size;

}

  const e=F.ex,d=e.date||sel||TODAY,names=[...new Set([...EXN,...S.ex.map(x=>x.name)])];
  const wk=Array.from({length:7},(_,i)=>add(TODAY,i-6)),mo=TODAY.slice(0,7);
  const mx=S.ex.filter(x=>x.date.slice(0,7)===mo),days=new Set(mx.map(x=>x.date)).size,tm=mx.reduce((a,x)=>a+x.min,0);
  let h=`<div class="card"><b>운동 체크</b>
  <input type="date" value="${d}" oninput="F.ex.date=this.value" style="margin:8px 0">
  <input type="text" list="exl" placeholder="종목 (예: 러닝)" value="${esc(e.name)}" oninput="F.ex.name=this.value"><datalist id="exl">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="number" placeholder="시간(분)" value="${esc(e.min)}" oninput="F.ex.min=this.value" style="width:110px"><input type="text" placeholder="세트·횟수·무게·거리" value="${esc(e.detail)}" oninput="F.ex.detail=this.value"></div>
  <textarea placeholder="메모" oninput="F.ex.note=this.value" style="margin-top:8px">${esc(e.note)}</textarea>
  <label class="row" style="margin-top:6px"><input type="checkbox" ${e.push?'checked':''} onchange="F.ex.push=this.checked"> 구글 캘린더에도 올리기</label>
  <button class="pri" style="margin-top:8px" onclick="addEx()">운동 체크 ✓</button>
  <div class="mut" style="margin-top:6px">저장하면 일정 달력의 해당 날짜에 💪가 표시돼요.</div></div>
  <div class="card"><div class="row"><div class="sp"><div class="mut">이번 달 운동한 날</div><b style="font-size:22px">${days}일</b></div><div class="sp"><div class="mut">이번 달 운동 시간</div><b style="font-size:22px">${tm}분</b></div></div>
  <div class="row" style="margin-top:10px;justify-content:space-between">${wk.map(k=>`<div style="text-align:center;font-size:11px" class="mut">${DAYS[parse(k).getDay()]}<div style="font-size:20px">${S.ex.some(x=>x.date===k)?'💪':'·'}</div></div>`).join('')}</div></div>`;
  const dates=[...new Set(S.ex.map(x=>x.date))].sort().reverse();
  h+=dates.length?dates.map(k=>`<div class="card"><b>${k}</b>`+S.ex.filter(x=>x.date===k).map(x=>`<div class="item" style="background:var(--bg);color:var(--tx);align-items:flex-start"><div class="sp"><b>${esc(x.name)}</b> <span class="mut">${x.min?x.min+'분':''} ${esc(x.detail)}</span>${x.note?`<div style="white-space:pre-wrap">${esc(x.note)}</div>`:''}</div><button class="ghost" onclick="delEx('${x.id}')">✕</button></div>`).join('')+'</div>').join(''):'<div class="mut">아직 운동 기록이 없어요.</div>';
  return h;
}
function togCal(id){S.off[id]=!S.off[id];save();syncG()}
function mv(n){const[y,m]=cm.split('-').map(Number);const d=new Date(y,m-1+n,1);cm=d.getFullYear()+'-'+pad(d.getMonth()+1);sel=cm+'-01';syncG()}

function logList(){
  const q=(F.q||'').trim().toLowerCase();
  const rows=S.logs.filter(l=>!q||(l.subject+' '+l.note).toLowerCase().includes(q));
  const dates=[...new Set(rows.map(l=>l.date))].sort().reverse();
  return dates.length?dates.map(d=>{const dd=parse(d);return `<div class="card" style="border-left:7px solid var(--ac2)"><b>${d} (${DAYS[dd.getDay()]})</b>`+rows.filter(l=>l.date===d).map(l=>`<div class="item" style="background:var(--bg);color:var(--tx);align-items:flex-start;margin-top:8px"><div class="sp"><b>${esc(l.subject)}</b>${l.min?` <span class="mut">${l.min}분</span>`:''}<div style="white-space:pre-wrap;margin-top:2px">${esc(l.note)}</div></div><button class="ghost" onclick="delLog('${l.id}')">✕</button></div>`).join('')+'</div>'}).join(''):`<div class="mut">${q?'검색 결과가 없어요.':'아직 쓴 알림장이 없어요.'}</div>`;
}
function exportLog(){
  const t=[...S.logs].sort((a,b)=>a.date.localeCompare(b.date)).map(l=>`[${l.date} (${DAYS[parse(l.date).getDay()]})] ${l.subject}${l.min?' · '+l.min+'분':''}\n${l.note}\n`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='알림장.txt';a.click();
}
/* Google Drive 알림장 */
const DJ='플래너_알림장_데이터.json',DD='📒 알림장 (플래너)';
let dstat={s:'',m:''},dchain=Promise.resolve();
function driveSync(push){dchain=dchain.then(()=>doSync(push)).catch(()=>{});return dchain}
async function dfetch(acct,url,opt={}){
  const k=tok[acct];if(!k||k.exp<Date.now())throw{code:'expired',acct};
  const r=await fetch(url,{method:opt.method||'GET',headers:{Authorization:'Bearer '+k.t,...(opt.headers||{})},body:opt.body});
  if(r.status===401){delete tok[acct];saveTok();throw{code:'expired',acct}}
  if(r.status===403)throw{code:'scope'};
  if(!r.ok)throw{message:(await r.text()).slice(0,160)};
  return opt.raw?r:(r.status===204?null:r.json());
}
async function dfind(a,name){const q="name='"+name.replace(/'/g,"\\'")+"' and trashed=false";const r=await dfetch(a,'https://www.googleapis.com/drive/v3/files?fields=files(id)&pageSize=1&q='+encodeURIComponent(q));return r.files&&r.files[0]?r.files[0].id:''}
async function dcreate(a,meta,mime,content){
  const b='pl'+uid();
  const body='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: '+mime+'; charset=UTF-8\r\n\r\n'+content+'\r\n--'+b+'--';
  const r=await dfetch(a,'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  return r.id;
}
async function dupdate(a,id,mime,content){await dfetch(a,'https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':mime+'; charset=UTF-8'},body:content})}
function docText(){return '📒 알림장\n\n'+[...S.logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>'■ '+l.date+' ('+DAYS[parse(l.date).getDay()]+') '+l.subject+(l.min?' · '+l.min+'분':'')+'\n'+l.note+'\n').join('\n')}
async function doSync(push){
  const D=S.drive;if(!D||!D.acct)return;const a=D.acct;
  if(!tok[a]||tok[a].exp<Date.now()){dstat={s:'err',m:'로그인이 만료됐어요. 사이드바에서 “다시 연결”을 눌러 주세요.'};render();return}
  dstat={s:'load',m:''};render();
  let docErr=0;
  try{
    if(!D.jsonId)D.jsonId=await dfind(a,DJ);
    let rem={logs:[],del:[]},created=false;
    if(D.jsonId){const r=await dfetch(a,'https://www.googleapis.com/drive/v3/files/'+D.jsonId+'?alt=media',{raw:true});try{rem=JSON.parse(await r.text())}catch(e){}}
    else created=true;
    const rl=rem.logs||[],rd=rem.del||[];
    const del=[...new Set([...(S.logDel||[]),...rd])];
    const map={};[...rl,...S.logs].forEach(l=>{if(!del.includes(l.id))map[l.id]=l});
    const logs=Object.values(map);
    const same=!created&&logs.length===rl.length&&del.length===rd.length&&logs.every(l=>rl.some(x=>x.id===l.id));
    S.logs=logs;S.logDel=del;save();
    const content=JSON.stringify({logs,del});
    if(created)D.jsonId=await dcreate(a,{name:DJ},'application/json',content);
    else if(push||!same)await dupdate(a,D.jsonId,'application/json',content);
    try{
      const txt=docText();
      if(!D.docId)D.docId=await dfind(a,DD);
      if(!D.docId)D.docId=await dcreate(a,{name:DD,mimeType:'application/vnd.google-apps.document'},'text/plain',txt);
      else if(push||!same||created)await dupdate(a,D.docId,'text/plain',txt);
    }catch(e){docErr=1}
    save();dstat={s:'ok',m:'',t:new Date(),docErr};
  }catch(e){dstat={s:'err',m:e.code==='scope'?'드라이브 권한이 없어요. 콘솔에서 Drive API를 켠 뒤 “권한 받기”를 눌러 주세요.':e.code==='expired'?'로그인이 만료됐어요. 사이드바에서 “다시 연결”을 눌러 주세요.':(e.message||'오류')}}
  render();
}
function driveErr(){return dstat.s==='err'?`<div class="bad" style="font-size:12px;margin-top:6px">${esc(dstat.m)} <button class="ghost" onclick="connect('${esc(S.drive?S.drive.acct:(S.accts[0]||''))}')">권한 받기</button></div>`:''}
function driveOn(){const a=$('#dacct').value;S.drive={acct:a};save();driveSync(true)}
function driveOff(){S.drive=null;dstat={s:'',m:''};save();render()}
function driveCard(){
  const h='<div class="card"><b>☁ 구글 드라이브에 저장</b>';
  if(!S.accts.length)return h+'<div class="mut" style="margin-top:6px">구글 계정을 먼저 연결해 주세요. 왼쪽 아래의 “＋ 계정 추가”를 누르세요.</div></div>';
  if(!S.drive)return h+`<div class="mut" style="margin:6px 0">알림장을 드라이브에 자동 저장해서 어느 기기에서든 볼 수 있어요.</div><div class="row" style="flex-wrap:nowrap"><select id="dacct" style="flex:1;min-width:0">${S.accts.map(a=>`<option>${esc(a)}</option>`).join('')}</select><button class="pri" onclick="driveOn()">연결</button></div>${driveErr()}</div>`;
  const D=S.drive;
  return h+`<div class="mut" style="margin:6px 0">${esc(D.acct)} · ${dstat.s==='load'?'동기화 중…':dstat.s==='ok'?'동기화됨 '+dstat.t.getHours()+':'+pad(dstat.t.getMinutes()):'대기 중'}</div>
  <div class="row"><button onclick="driveSync(true)">지금 동기화</button>${D.docId?`<button onclick="window.open('https://docs.google.com/document/d/${D.docId}/edit','_blank')">문서로 보기</button>`:''}<button class="ghost" onclick="driveOff()">연결 해제</button></div>${dstat.docErr?'<div class="mut" style="font-size:12px;margin-top:4px">읽기용 문서 갱신은 실패했어요. 알림장 데이터는 저장됐어요.</div>':''}${driveErr()}</div>`;
}
function logView(){
  const subs=[...new Set(S.logs.map(l=>l.subject).concat(S.sess.map(s=>s.subject)))],g=F.lg;
  return driveCard()+`<div class="card"><b>📒 ${sel} 알림장 쓰기</b>
  <input type="text" id="sj" list="sl" placeholder="제목 / 과목" value="${esc(g.sj)}" oninput="F.lg.sj=this.value" style="margin:8px 0"><datalist id="sl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist>
  <textarea id="nn" oninput="F.lg.nn=this.value" placeholder="오늘 배운 것, 숙제, 챙길 것, 기억할 말…" style="min-height:130px">${esc(g.nn)}</textarea>
  <input type="number" id="mn" value="${esc(g.mn)}" oninput="F.lg.mn=this.value" placeholder="공부 시간 (분, 선택)" style="margin-top:8px">
  <button class="pri" style="margin-top:8px" onclick="addLog()">저장</button></div>
  <div class="card"><div class="row" style="flex-wrap:nowrap"><input type="text" placeholder="🔍 알림장 검색" value="${esc(F.q)}" oninput="F.q=this.value;$('#loglist').innerHTML=logList()"><button onclick="exportLog()">내보내기</button></div></div>
  <div id="loglist">${logList()}</div>`;
}
function timeView(){
  const run=!!S.timer,subs=[...new Set(S.sess.map(s=>s.subject))];
  const todaySec=S.sess.filter(s=>s.date===TODAY).reduce((a,s)=>a+s.sec,0)+(run?elapsed():0);
  let h=`<div class="card"><div class="mut" style="text-align:center">${run?esc(S.timer.subject)+' 공부 중':'오늘 총 공부 시간'}</div>
  <div class="big" id="clock">${hms(run?elapsed():todaySec)}</div>`;
  h+=run?`<div class="row" style="justify-content:center;margin-top:10px"><button class="pink" onclick="tStop()">■ 종료</button></div><div class="mut" style="text-align:center;margin-top:6px">오늘 합계 <span id="tot">${hms(todaySec)}</span></div>`
  :`<input type="text" id="ts" list="sl2" placeholder="과목 (예: 영어)" style="margin:10px 0"><datalist id="sl2">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><div class="row" style="justify-content:center"><button class="pri" onclick="tStart()">▶ 공부 시작</button></div>`;
  h+=`<div style="margin-top:12px" class="mut"><label class="row"><input type="checkbox" ${S.push?'checked':''} onchange="setPush(this.checked)"> 종료할 때 구글 캘린더에도 기록</label>
  ${cals.length?`<select onchange="setWr(this.value)" style="margin-top:6px">${cals.filter(isW).map(c=>`<option value="${esc(c.k)}" ${S.wr===c.k?'selected':''}>${esc(c.summary)}</option>`).join('')}</select>`:''}</div></div>`;
  const wk=Array.from({length:7},(_,i)=>add(TODAY,i-6)),vals=wk.map(sessMin),mx=Math.max(...vals,1);
  let streak=0,d=TODAY;if(!sessMin(d))d=add(d,-1);while(sessMin(d)){streak++;d=add(d,-1)}
  const by={};S.sess.forEach(s=>by[s.subject]=(by[s.subject]||0)+s.sec/60);
  h+=`<div class="card"><div class="row"><div class="sp"><div class="mut">연속 공부일</div><b style="font-size:22px">${streak}일</b></div><div class="sp"><div class="mut">최근 7일 합계</div><b style="font-size:22px">${Math.round(vals.reduce((a,b)=>a+b,0)/60*10)/10}시간</b></div></div></div>
  <div class="card"><b>최근 7일 (분)</b><div class="bars" style="margin-top:10px">${wk.map((k,i)=>`<div><i style="height:${vals[i]/mx*80}px"></i>${vals[i]||''}<br>${DAYS[parse(k).getDay()]}</div>`).join('')}</div></div>
  <div class="card"><b>과목별 누적</b>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:4px 0"><span class="sp">${esc(k)}</span><span class="mut">${Math.round(v)}분</span></div>`).join('')||'<div class="mut">타이머를 쓰면 쌓여요.</div>'}</div>
  <div class="card"><b>오늘 세션</b>${S.sess.filter(s=>s.date===TODAY).map(s=>`<div class="row" style="padding:4px 0"><span class="sp">${s.start} ${esc(s.subject)}</span><span class="mut">${Math.round(s.sec/60)}분</span><button class="ghost" onclick="delS('${s.id}')">✕</button></div>`).join('')||'<div class="mut">아직 없어요.</div>'}</div>
  <div class="card"><b>백업</b><div class="row" style="margin-top:6px"><button onclick="exp()">내보내기</button><button onclick="$('#im').click()">불러오기</button><input id="im" type="file" class="hid" accept=".json" onchange="imp(this)"></div></div>`;
  return h;
}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='planner-backup.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(S,JSON.parse(r.result));save();render()}catch(e){alert('파일을 읽을 수 없어요')}};r.readAsText(f)}

function render(){
  const T={cal:['📅 일정','일정'],log:['📒 알림장','알림장'],time:['⏱ 스터디 타임체크','타임체크'],ex:['💪 운동 기록','운동 기록']};
  $('#ttl').textContent=T[tab][0];
  $('#side').innerHTML='<h2>🐰 내 플래너</h2>'+Object.keys(T).map(k=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${T[k][1]}</button>`).join('')+'<div class="face"></div>'+acctHTML();
  $('#macct').innerHTML=acctHTML();
  $('#app').innerHTML={cal:calView,log:logView,time:timeView,ex:exView}[tab]();
  clearInterval(tick);
  if(S.timer&&tab==='time')tick=setInterval(()=>{const c=$('#clock');if(c)c.textContent=hms(elapsed());const t=$('#tot');if(t)t.textContent=hms(S.sess.filter(s=>s.date===TODAY).reduce((a,s)=>a+s.sec,0)+elapsed())},1000);
}
render();initG();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
